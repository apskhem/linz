name: Fundamental Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    # building needs Node 22.18+ (tsup), the library itself supports Node 20+
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Setup
      run: npm install
    - name: Run type checks
      run: npm run check
    - name: Build
      run: npm run build
    - name: Run lint
      run: npm run lint
    - name: Run tests
      run: npm run test
    - name: Run end-to-end tests
      run: npm run test:e2e
